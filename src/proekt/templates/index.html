{% extends "base.html" %}

{% block title %}GoodReads{% endblock %}

{% block content %}

<nav class="navbar">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="/">GG</a>
        <div>
            <a href="/login" class="btn btn-outline-primary me-2">
                Login
            </a>

            <a href="/register" class="btn btn-primary">
                Register
            </a>
        </div>
    </div>
</nav>

<main class="container text-center">

    <div class="mt-5">

        <h1 class="display-1 fw-bold">
            GoodGames
        </h1>

        <p class="lead fst-italic">
            your video games in one place
        </p>
    </div>

    <form action="/search" method="GET" class="row justify-content-center mt-4">
        <div class="col-md-6">
            <div class="input-group">

                <select name="type" class="form-select" style="max-width: 150px;">
                    <option value="name">Name</option>
                    <option value="genre">Genre</option>
                    <option value="studio">Studio</option>
                </select>

                <input type="text" name="q" class="form-control" placeholder="Search for a game..." required>

                <button type="submit" class="btn btn-primary">
                    Search
                </button>
            </div>
        </div>
    </form>
</main>
{% endblock %}
